# Railway multi-service configuration for Minutely.
# Two services, one per top-level subdirectory. Railway builds each from its
# own `source` folder using the Dockerfile it finds there. PORT is injected
# at runtime and is read by both services from the environment.

[[services]]
name = "backend"
source = "backend"

  [services.build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

  [services.deploy]
  startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
  healthcheckPath = "/api/v1/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[[services]]
name = "frontend"
source = "frontend"

  [services.build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

  [services.deploy]
  startCommand = "node server.js"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
