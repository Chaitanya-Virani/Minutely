services:
  backend:
    build:
      context: ./backend
    container_name: minutely-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: minutely-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      # Server-side only: the Next.js proxy routes (/api/generate-report,
      # /api/config) fetch the backend by this URL. Inside the compose network
      # that must be the backend service name, not localhost (which would point
      # at the frontend container itself).
      BACKEND_URL: "http://backend:8000"
      PORT: "3000"
    depends_on:
      - backend
    restart: unless-stopped
